# GENERATED by gen_manifest.py from the live ACTIONS dict — do not
# hand-edit actions/args; edit the handlers + header consts and rerun:
#   .venv/Scripts/python tools/connector-builder/gen_manifest.py
name: connector-builder
description: 'AI Connector Builder (connector-builder.procesio.app): turn API documentation into a compiled
  PROCESIO Custom Action .nupkg connector via an 8-stage LLM pipeline (gather -> clarify -> plan -> generate
  -> validate -> compile -> fix -> deliver). Drive the whole build lifecycle, read/write generated files,
  download the .nupkg artifact (to upload to PROCESIO for live testing), inspect logs/telemetry, and edit
  the builder''s own knowledge base (prompts, spec modules, examples, validation rules). Two auth modes,
  both -> Bearer token: an acb_ API key, or username/password via /auth/login.'
version: 0.2.0
runtime: python
entrypoint: main.py
secrets:
- name: api-key
  description: Connector Builder API key (acb_...). Used verbatim as the bearer token.
- name: username
  description: Login email for username/password auth mode (e.g. user@example.com).
- name: password
  description: Login password for username/password auth mode (-> POST /auth/login -> JWT).
routing:
  triggers:
  - build a PROCESIO custom action / connector from API docs
  - generate a .nupkg connector for PROCESIO from documentation
  - create / run / drive an AI Connector Builder build
  - approve / revise the plan / regenerate files / download the connector artifact
  - edit the connector builder's prompts / spec modules / examples (improve generation)
  primary_action: create-build
  example: connector-builder create-build --api-url <docs-url> --user-requirements '...'   (then gather
    / answer / approve-plan / approve-generate / download-artifact)
actions:
- name: answer
  description: Submit clarification answers; triggers PLAN.
  args:
  - name: build-id
    type: string
    required: true
    description: Build UUID
  - name: answers
    type: string
    required: true
    description: JSON object {"q1":"a1","q2":"a2"}
  - name: wait
    type: boolean
    description: Poll get-build until the stage settles (survives the proxy 504)
  - name: wait-timeout
    type: integer
    description: Max seconds to poll when --wait (default 600)
  - name: poll-interval
    type: integer
    description: Seconds between polls when --wait (default 8)
  output_schema: '{ "status": "planning", "implementation_plan": {...} }'
- name: api
  description: Call any endpoint (method/path/query/body); --out streams binary.
  args:
  - name: method
    type: string
    description: HTTP method (GET/POST/PUT/PATCH/DELETE)
  - name: path
    type: string
    required: true
    description: Endpoint path, e.g. /builds or /admin/users
  - name: query
    type: string
    description: Query params as a JSON object
  - name: body
    type: string
    description: Request body as JSON (object or array)
  - name: out
    type: string
    description: If set, stream the response to this file (binary)
- name: approve-generate
  description: Accept generated files; runs VALIDATE->COMPILE->FIX->DELIVER.
  args:
  - name: build-id
    type: string
    required: true
    description: Build UUID
  output_schema: '{ "status": "approved", "build_id": "uuid" }'
- name: approve-plan
  description: Approve plan; triggers GENERATE (then pauses).
  args:
  - name: build-id
    type: string
    required: true
    description: Build UUID
  output_schema: '{ "status": "generating", "step_status": "waiting_user", "generated_files": {...} }'
- name: archive
  description: Archive a build (admin).
  args:
  - name: build-id
    type: string
    required: true
    description: Build UUID
- name: build-selftest
  description: Compiler health self-test (trivial C#).
- name: check
  description: Connectivity + auth probe (GET /auth/me).
  output_schema: '{ "ok": true, "email": "...", "role": "admin", "base_url": "..." }'
- name: create-api-key
  description: Create an API key (full_key shown only once).
  args:
  - name: name
    type: string
    required: true
    description: Label for the new API key
- name: create-build
  description: Create a build from URL(s) / pasted docs.
  args:
  - name: api-url
    type: string
    description: Single API docs URL
  - name: api-urls
    type: string
    description: JSON array of doc URLs
  - name: api-docs-text
    type: string
    description: Pasted API documentation text
  - name: user-requirements
    type: string
    description: What the connector should do
  output_schema: '{ "id": "uuid", "status": "pending", ... }'
- name: delete-llm-key
  description: Remove the stored LLM provider key.
- name: download-all
  description: Download all generated files as a zip to --out.
  args:
  - name: build-id
    type: string
    required: true
    description: Build UUID
  - name: out
    type: string
    required: true
    description: Output file path
- name: download-artifact
  description: Download the compiled .nupkg to --out (upload to PROCESIO).
  args:
  - name: build-id
    type: string
    required: true
    description: Build UUID
  - name: out
    type: string
    required: true
    description: Output file path
  output_schema: '{ "out": "...", "bytes": N, "filename": "..._PROCESIO.API.nupkg" }'
- name: download-file
  description: Download one generated file to --out.
  args:
  - name: build-id
    type: string
    required: true
    description: Build UUID
  - name: filename
    type: string
    required: true
  - name: out
    type: string
    required: true
    description: Output file path
- name: events
