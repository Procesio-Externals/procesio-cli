    type: string
    required: true
    description: Build UUID
  - name: page
    type: integer
    description: Page number (default 1)
  - name: per-page
    type: integer
    description: Items per page (default 100)
  - name: step
    type: string
    description: Filter by step
  - name: level
    type: string
    description: Filter by level
  - name: event-type
    type: string
    description: Filter by event type
- name: gather
  description: Run GATHER+CLARIFY (profile+questions); --wait survives the 504.
  args:
  - name: build-id
    type: string
    required: true
    description: Build UUID
  - name: wait
    type: boolean
    description: Poll get-build until the stage settles (survives the proxy 504)
  - name: wait-timeout
    type: integer
    description: Max seconds to poll when --wait (default 600)
  - name: poll-interval
    type: integer
    description: Seconds between polls when --wait (default 8)
  output_schema: '{ "status": "clarifying", "api_profile": {...}, "clarification_questions": [...] }'
