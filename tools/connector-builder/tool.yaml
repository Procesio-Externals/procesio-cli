  args:
  - name: build-id
    type: string
    required: true
    description: Build UUID
  - name: filename
    type: string
    required: true
  - name: version
    type: string
    required: true
    description: Version number
- name: get-issue
  description: Full issue-case detail incl. snapshots.
  args:
  - name: id
    type: string
    required: true
    description: Issue case id
- name: knowledge-create
  description: Create a new knowledge module.
  args:
  - name: module-type
    type: string
