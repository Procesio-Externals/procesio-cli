- name: update-schedule
  description: Update a schedule (PUT /api/Schedules) from a JSON --payload; --cron/--timezone sets a crontab recurrence.
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: payload
    type: string
    required: true
    description: schedule as a JSON object (see PROCESIO-API-NOTES.md for the shape)
  - name: cron
    type: string
    required: false
    description: 5-field crontab expression (min hour day month weekday); sets the recurrence to CRON (type 8) over the --payload. Preview it first with validate-crontab.
  - name: timezone
    type: string
    required: false
    description: IANA timezone id for the cron (e.g. Europe/Bucharest)
  - name: recurrence-info
    type: string
    required: false
    description: human-readable recurrence label (optional)
- name: validate-crontab
  description: Preview a crontab expression's next occurrences (POST /api/Schedules/validate-crontab).
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: cron
    type: string
    required: true
    description: 5-field crontab expression to validate (min hour day month weekday)
  - name: timezone
    type: string
    required: false
    description: IANA timezone id (default server/UTC)
  - name: count
    type: integer
    required: false
    description: how many upcoming occurrences to return (default 5, max 20)
  - name: start-date
    type: string
    required: false
    description: ISO-8601 activation start (optional)
  - name: end-date
    type: string
    required: false
    description: ISO-8601 activation end (optional)
- name: variable-set-type
  description: Retype one variable of a live process (dataType, optionally isList) -> validate + flow-lint -> PUT. Refuses an input/output variable without --allow-contract-change, because those are the run payload and the response shape callers depend on.
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: id
    type: string
    required: true
    description: process (project) id
  - name: variable
    type: string
    required: true
    description: variable name or id
  - name: data-type
    type: string
    required: true
    description: target dataType id (e.g. ...121221 Object, ...121220 Json, ...121214 String)
  - name: is-list
    type: string
    required: false
    description: true/false to also set isList; omit to keep it
  - name: allow-contract-change
    type: boolean
    required: false
    description: permit retyping an input (10) / output (30) variable - changes the public contract
  - name: dry-run
    type: boolean
    required: false
    description: retype + validate but do not PUT
