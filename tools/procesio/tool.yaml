- name: process-create
  description: Create a PROCESIO process from a validated config (build->validate->POST->re-GET). --dry-run to preview the DTO.
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: config
    type: string
    required: false
    description: resource config as a JSON object
  - name: config-file
    type: string
    required: false
    description: path to a JSON config file
  - name: dry-run
    type: boolean
    required: false
    description: build + validate the DTO and return it without creating
  - name: force
    type: boolean
    required: false
    description: bypass the pre-save FE (designer) + BE validation gate
  - name: no-types
    type: boolean
    required: false
    description: skip the advisory data-type-mismatch (warning) layer in the gate
- name: process-delete
  description: Delete a resource by id (DELETE /api/Projects/{id}).
