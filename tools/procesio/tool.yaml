- name: node-replace-text
  description: Replace an EXACT literal in every string leaf of a node's runtime parameters AND designer settings on a live process - the safe way to reach a value nested inside a structured parameter (a Map Data expression, a decisional literal). --expect N asserts the hit count; --dry-run previews. Validates + flow-lints before PUT.
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: id
    type: string
    required: true
    description: process (project) id
  - name: node
    type: string
    required: true
    description: node actionName (canvas label) or id
  - name: property
    type: string
    required: false
    description: narrow the sweep to one parameter (designer label or tabPropertyId)
  - name: find
    type: string
    required: true
    description: exact literal to replace (no regex)
  - name: replace
    type: string
    required: true
    description: replacement literal
  - name: expect
    type: integer
    required: false
    description: assert this many replacements; a mismatch writes nothing
  - name: allow-binding-change
    type: boolean
    required: false
    description: permit a find/replace that touches a positional variable placeholder
  - name: dry-run
    type: boolean
    required: false
    description: replace + normalize + validate but do not PUT
- name: node-set-param
  description: Surgically set ONE node parameter's literal text on a live process (an endpoint, timeout, SQL or script body) -> regenerate the designer layer from the runtime layer -> validate + flow-lint -> PUT. --dry-run to preview; an invalid flow is never PUT. Structured (list/dict) parameters stay process-edit territory.
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: id
    type: string
    required: true
    description: process (project) id
  - name: node
    type: string
    required: true
    description: node actionName (canvas label) or id
  - name: property
    type: string
    required: true
    description: parameter's designer label (e.g. 'Endpoint') or its tabPropertyId
  - name: value
    type: string
    required: true
    description: new literal text; keep every positional variable placeholder the old value had
  - name: allow-binding-change
    type: boolean
    required: false
    description: permit a different placeholder set (only when variable[] is rewritten too)
  - name: dry-run
    type: boolean
    required: false
    description: patch + normalize + validate but do not PUT
