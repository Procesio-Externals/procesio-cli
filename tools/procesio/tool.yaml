    description: which flow when the bundle has more than one
  - name: resource-map
    type: boolean
    required: false
    description: emit every flow + the cross-process (process→process) edge list
- name: relayout-process
  description: 'Re-lay-out a LIVE process in place: read the flow, run the auto-layout engine (LAYOUT_ENGINE env: legacy default / elk), validate, and save back (PUT /api/Projects). --dry-run to preview without saving. Workspace-scoped: pass --workspace-id.'
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: id
    type: string
    required: true
    description: process (project) id to re-lay-out in place
  - name: no-validate
    type: boolean
    required: false
    description: skip the POST /api/Projects/validate safety gate before saving
  - name: dry-run
    type: boolean
    required: false
    description: compute + return the new layout WITHOUT saving (no PUT)
  - name: no-cluster
    type: boolean
    required: false
    description: 'legacy engine: disable clustering (clustering is ON by default — the classic engine folds long chains into shelves)'
- name: remove-credential
  description: Delete a credential profile and its cached token.
  args:
  - name: name
    type: string
    required: true
    description: profile name
- name: remove-environment
  description: Remove a user-defined environment (built-in Internal-* cannot be removed).
  args:
  - name: name
    type: string
    required: true
    description: environment name to switch to
- name: rename-actions
  description: 'Rename a LIVE process''s canvas actions in bulk from an id → name map (--map JSON or --map-file), setting BOTH ActionName and CustomData.name; validates, then saves (PUT /api/Projects). Names are cosmetic — wiring is by id — so this cannot break a flow. --dry-run to preview. Workspace-scoped: pass --workspace-id.'
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: id
    type: string
    required: true
    description: process (project) id whose actions to rename
  - name: map
    type: string
    required: false
    description: 'id → name map as JSON: {"<action-id>": "New name", ...}. A unique id PREFIX is accepted in place of a full id.'
  - name: map-file
    type: string
    required: false
    description: path to a JSON file holding the same id → name map
  - name: no-validate
    type: boolean
    required: false
    description: skip the POST /api/Projects/validate safety gate before saving
  - name: dry-run
    type: boolean
    required: false
    description: report the renames WITHOUT saving (no PUT)
  - name: force
    type: boolean
    required: false
    description: overwrite even if the resource changed since it was read (skip the optimistic-concurrency check)
- name: repair-datastore-mapper
  description: 'Repair a .procesio pack whose Data Store mapper the export re-spelled into the refused `document`/`process` form (offline). An imported process carrying the exported form cannot run. Idempotent: an already-correct pack is unchanged.'
  args:
  - name: in
    type: string
    required: true
    description: the .procesio pack to repair (a path, or '-' for stdin)
  - name: out
    type: string
    required: false
    description: write the repaired pack here (omit to print it)
  - name: dry-run
    type: boolean
    required: false
    description: report what would change without writing anything
- name: request
  description: 'Call ANY Web-API endpoint: --method --path [--query JSON] [--body JSON].'
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
