- name: run-process-with-file
  description: 'Run a process that takes File input variable(s): publish -> upload bytes -> launch -> poll -> output. --file VARNAME=PATH (repeatable).'
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
