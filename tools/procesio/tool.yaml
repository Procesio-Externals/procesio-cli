- name: run-form-with-files
  description: 'Submit a form the way a browser does: publish -> upload files -> launch -> read variables, through the public FormProcess endpoints. Proves the form''s own input/output maps carry values.'
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: form-id
    type: string
    required: true
    description: form template id
  - name: process-id
    type: string
    required: true
    description: process (flow template) id the form submits to
  - name: file
    type: string
    required: false
    description: VARNAME=PATH for a File input variable (repeatable)
  - name: payload
    type: string
    required: false
    description: non-file input variables as a JSON object
  - name: synchronous
    type: boolean
    required: false
    description: wait for the flow to finish (default)
  - name: no-synchronous
    type: boolean
    required: false
    description: fire and forget
  - name: timeout
    type: integer
    required: false
    description: synchronous wait, seconds (default 120)
- name: run-process
