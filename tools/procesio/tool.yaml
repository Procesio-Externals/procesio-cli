- name: import
  description: Import components from a .procesio bundle (POST /api/Transport/import); mirrors export.
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: file
    type: string
    required: true
    description: path to the .procesio bundle to import
  - name: no-override-data
    type: boolean
    required: false
    description: send overrideData=false (default true)
  - name: no-data-types
    type: boolean
    required: false
    description: send importDataTypes=false (default true)
  - name: no-flows
    type: boolean
    required: false
    description: send importFlows=false (default true)
  - name: no-credentials
    type: boolean
    required: false
    description: send importCredentials=false (default true)
  - name: no-documents
    type: boolean
    required: false
    description: send importDocuments=false (default true)
  - name: no-forms
    type: boolean
    required: false
    description: send importForms=false (default true)
  - name: no-data-stores
    type: boolean
    required: false
    description: send importDataStores=false (default true)
- name: inspect-flow
  description: 'Structural summary of a flow (offline): counts, action families, branches, subprocess calls, resources, variables, advisory smells.'
  args:
  - name: in
    type: string
    required: true
    description: '.procesio export or flow JSON: a path, ''-'' for stdin, or raw JSON'
  - name: flow-id
    type: string
    required: false
    description: which flow when the bundle has more than one
- name: layout-flow
  description: Recompute tidy canvas positions for a flow (deterministic, offline). Writes positions back into a re-importable bundle (--out) or prints it.
  args:
  - name: in
    type: string
    required: true
    description: '.procesio export or flow JSON: a path, ''-'' for stdin, or raw JSON'
  - name: flow-id
    type: string
    required: false
    description: which flow when the bundle has more than one
  - name: out
    type: string
    required: false
    description: write the re-laid-out bundle here (omit to print it)
  - name: only
    type: string
    required: false
    description: comma-separated action ids to reposition WITHOUT reshuffling the rest (re-tidy just these; everything else stays byte-identical)
  - name: cluster
    type: boolean
    required: false
    description: 'cluster consecutive horizontal actions: fold a long run (>=5 1-in/1-out actions, outside a For-Each) into a compact serpentine grid to conserve space. Opt-in.'
  - name: min-crossings
    type: boolean
    required: false
    description: 'best-effort edge-crossing reduction: nudge movable actions to cut line crossings (minimizes, not guaranteed zero). Opt-in.'
  - name: dry-run
    type: boolean
    required: false
    description: emit the computed positions only; write/print nothing else
- name: layout-report
  description: 'Engine-agnostic layout verification: readability report for a laid-out flow (hard issues + crossings, edge lengths, vertical rows, For-Each padding/size). Works for ANY layout engine. Offline via --in, or LIVE via --id + --workspace-id.'
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: in
    type: string
    required: false
    description: '.procesio export or flow JSON: a path, ''-'' for stdin, or raw JSON (offline). Omit and pass --id to verify a LIVE process instead.'
  - name: id
    type: string
    required: false
    description: verify a LIVE process by id (needs --workspace-id); alternative to --in
  - name: flow-id
    type: string
    required: false
    description: which flow when the bundle has more than one
- name: layout-resource-map
  description: Position the cross-process (process→process) call graph from a bundle (offline).
  args:
  - name: in
    type: string
    required: true
    description: '.procesio export bundle: a path, ''-'' for stdin, or raw JSON'
  - name: root-flow-id
    type: string
    required: false
    description: the LVL0 process to center the map on (optional)
  - name: levels
    type: integer
    required: false
    description: 'max depth each side (default: unlimited)'
