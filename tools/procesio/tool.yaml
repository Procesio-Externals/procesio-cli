  - name: id
    type: string
    required: true
    description: process (project) id
- name: process-validate
  description: Validate a process with PROCESIO's own validator (POST /api/Projects/validate).
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
