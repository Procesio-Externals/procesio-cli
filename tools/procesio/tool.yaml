- name: process-fe-validate
  description: 'Front-end (designer-layer) ''Process Errors'' validation on a live process — the client-side check that BLOCKS designer Save but which POST /api/Projects/validate does NOT catch: unconnected actions, missing Start/Stop, empty node names, required-empty fields, leftover placeholders, bad number/integer values, out-of-range limits, duplicate/primitive-named variables, and unmapped required subprocess inputs. clean=true when no blocking errors. Data-type mismatches are reported as (non-blocking) warnings. This same check auto-runs before every process-create / process-edit. Add --include-be for the BE layer.'
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: id
    type: string
    required: true
    description: process (project) id to validate
  - name: no-types
    type: boolean
    required: false
    description: skip the advisory data-type-mismatch (warning) layer
  - name: include-be
    type: boolean
    required: false
    description: also run the back-end validator (POST /api/Projects/validate)
- name: process-toggle-activation
  description: Arm/disarm a process's triggers (PATCH /api/Projects/{id}/toggle-activation); re-reads and reports the ACTUAL `active` state, because the PATCH reports success either way.
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
