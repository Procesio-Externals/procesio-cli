- name: form-set-element-config
  description: 'Set one element''s plain configs in place (surgical: only that element''s config values change, ids preserved; returns the previous values). Event configs go through form-set-element-event.'
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: id
    type: string
    required: true
    description: form template id
  - name: element
    type: string
    required: true
    description: element id, or its `name` config as the designer shows it
  - name: set
    type: string
    required: false
    description: key=value to write (repeatable); the value is parsed as JSON when it parses, otherwise stored as a plain string. A value that LOOKS like JSON (true/42/[..]) is stored as that type — for a literal string that looks like JSON, use --set-file (always a string)
  - name: set-file
    type: string
    required: false
    description: key=path to write a config's value from a file (repeatable) — for long HTML labels
  - name: dry-run
    type: boolean
    required: false
    description: report the change (and the previous values) without writing
  - name: force
    type: boolean
    required: false
    description: overwrite even if the resource changed since it was read (skip the optimistic-concurrency check)
- name: form-set-element-event
  description: 'Wire one element''s trigger to RUN_PROCESS / RUN_JAVASCRIPT / RUN_DATA_STORE_OPERATION in place (surgical: only that element''s event config changes; process-variable names in inputMap/outputMap are resolved to guids; a DataStore op takes --data-store-id + --operation).'
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: id
    type: string
    required: true
    description: form template id
  - name: element
    type: string
    required: true
    description: element id, or its designer 'name' (e.g. doccipf)
  - name: 'on'
    type: string
    required: true
    description: 'trigger: click | input | stepChange | paginationChanged | rowAdded'
  - name: action
    type: string
    required: true
    description: RUN_PROCESS | RUN_JAVASCRIPT | RUN_DATA_STORE_OPERATION
  - name: config
    type: string
    required: false
    description: event config as JSON
  - name: data-store-id
    type: string
    required: false
    description: 'RUN_DATA_STORE_OPERATION: the target data store id'
  - name: operation
    type: string
    required: false
    description: 'RUN_DATA_STORE_OPERATION: READ | ADD | UPDATE | DELETE'
  - name: config-file
    type: string
    required: false
    description: path to a JSON config file
  - name: type
    type: string
    required: false
    description: override the event type (default follows the trigger)
  - name: replace
    type: boolean
    required: false
    description: replace ALL of this trigger's events instead of appending (destructive; warns when it discards more than one)
  - name: replace-action
    type: string
    required: false
    description: replace only this trigger's events whose action is this (RUN_PROCESS/RUN_JAVASCRIPT), preserving the others and order
  - name: dry-run
    type: boolean
    required: false
    description: build the event and report it without writing
  - name: force
    type: boolean
    required: false
    description: overwrite even if the resource changed since it was read (skip the optimistic-concurrency check)
- name: form-update
  description: 'Safely save an arbitrary change to a LIVE form: GET it, deep-merge a --data patch into its Data (and/or override --name/--status/--state/--is-private), then PUT the server-accepted PascalCase DTO. Preserves elements/theme/code (never rebuilds like form-edit). Last-write-wins guard (--force); --dry-run previews the DTO.'
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: id
    type: string
    required: true
    description: form template id
  - name: data
    type: string
    required: false
    description: JSON object deep-merged into the form's Data (a merge patch)
  - name: data-file
    type: string
    required: false
    description: path to a JSON file with the Data merge patch
  - name: name
    type: string
    required: false
    description: rename the form (top-level Name)
  - name: status
    type: integer
    required: false
    description: 'publication status: 1=published, 0=draft'
  - name: state
    type: string
    required: false
    description: enabled flag (true/false)
  - name: is-private
    type: string
    required: false
    description: 'reachability: false + --status 1 makes the form answer an anonymous visitor on its custom URL; true keeps it behind a PROCESIO login'
  - name: dry-run
    type: boolean
    required: false
    description: build the PUT DTO and return it without saving (GET only)
  - name: force
    type: boolean
    required: false
    description: overwrite even if the resource changed since it was read (skip the optimistic-concurrency check)
