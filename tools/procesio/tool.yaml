# Generated from the dispatcher (handlers + autogen). Do not hand-edit arg lists;
# regenerate after changing handlers/autogen. See tests/test_manifest_sync.py.
name: procesio
description: 'PROCESIO low-code automation platform (procesio.app/.com). Full 1:1 coverage of the Web
  API: every endpoint is an action (<method>-<path> names) plus ergonomic shortcuts, a generic `request`,
  and an `export` (.procesio Transport). Dual auth (API key per-workspace, or username/password cookie
  session) with a multi-credential profile store; --profile picks the account/key, --workspace-id sets
  the active workspace. Multi-environment: named <Client>-<ENV> environments (Internal-PROD/QA/DEV built in,
  client envs added at runtime) each carry their own host URLs and bound credentials; switch the default with
  set-environment or per-call with --environment (unbound credentials stay on Internal-PROD).'
version: 0.4.0
runtime: python
entrypoint: main.py
routing:
  triggers:
  - procesio
  - run a procesio process
  - launch procesio process
  - procesio workspace
  - procesio api
  - list procesio processes
  - procesio instance
  - trigger procesio flow
  - procesio endpoint
  - export procesio
  - procesio export
  - import procesio / import a .procesio bundle
  - duplicate a process / copy a process / clone a process
  - delete a process / form / document / webhook / credential
  - validate a process (correctness oracle)
  - test a credential connection / test a custom action
  - upload / install / delete / list a custom action (.nupkg connector)
  - download a flow-instance file (Generate-Document output)
  - layout / re-lay-out a process canvas; read or inspect a flow graph
  - list forms / list documents; get or toggle a process; AI Decisional
  - switch procesio environment / work on PROCESIO Internal-QA / Internal-DEV / a client env
  - list / add / set the default procesio environment (<Client>-<ENV>); bind a credential to an environment
  - run procesio against QA / DEV / staging / a client installation
  primary_action: run-process
  example: 'procesio list-processes   (run: procesio run-process --id <id> --payload ''{...}'')'
secrets:
- name: credentials
  description: JSON index of stored credential profiles. Profiles live under agents-and-tools:procesio:cred-<name>
    (API keys and username/password accounts). Manage with add-credential / list-credentials.
- name: form-code-key
  optional: true
  description: AES passphrase used to encrypt a form's Data.code blob (the designer's
    'Switch to code' CSS + JavaScript). Required only to build forms WITH form-level
    CSS/JS; theme, element styles, and element events do not need it. It is a STATIC
    PLATFORM key, not a per-user credential - it is not issued or generated per
    person, so it is obtained from someone who already holds it, or read from the
    webapp bundle that performs the AES step. Optional because without it every
    other procesio action works, and only form-get-code / form-set-code fail.
healthcheck:
  action: check-auth
  label: "auth check (active environment)"

requires:
  - name: node
    kind: binary
    why: >
      runs the elkjs layout runner (tools/procesio/layout/elk/elk_runner.mjs) behind the
      ELK 'layered' canvas engine used by the layout actions.
    check: node --version
    install: winget install --id OpenJS.NodeJS.LTS -e --silent
  - name: elkjs
    kind: runtime
    why: >
      the ELK layout library (tools/procesio/layout/elk/node_modules), installed by npm
      and NOT by uv sync, so a fresh checkout has it missing. It is reached lazily through
      a subprocess and every failure degrades silently to the legacy layout engine - the
      tool still reports ready and the canvas still lays out, just not with ELK quality.
      That silence is the reason it must be declared here.
    check: npm ls elkjs --prefix tools/procesio/layout/elk
    install: npm install --prefix tools/procesio/layout/elk

actions:
- name: add-credential
  description: Store a new credential profile (apikey or userpass) in Credential Manager.
  args:
  - name: name
    type: string
    required: true
    description: profile name, e.g. 'personal'
  - name: type
    type: string
    required: true
    description: ''
  - name: key
    type: string
    required: false
    description: 'apikey: the key NAME header value (omit to be prompted without echoing)'
  - name: value
    type: string
    required: false
    description: 'apikey: the key VALUE header value (omit to be prompted without echoing)'
  - name: workspace-id
    type: string
    required: false
    description: 'apikey: workspace GUID (sent as the workspaceid header)'
  - name: workspace
    type: string
    required: false
    description: 'apikey: a human label for the workspace'
  - name: username
    type: string
    required: false
    description: 'userpass: account email/username'
  - name: password
    type: string
    required: false
    description: 'userpass: account password (omit to be prompted without echoing)'
  - name: realm
    type: string
    required: false
    description: 'userpass: override realm (default procesio01)'
  - name: client-id
    type: string
    required: false
    description: 'userpass: override client_id (default procesio-ui)'
  - name: environment
    type: string
    required: false
    description: 'bind this credential to an environment, e.g. Internal-QA (default: Internal-PROD). Add a client env first with add-environment.'
  - name: web-base
    type: string
    required: false
    description: override Web API base URL
  - name: auth-base
    type: string
    required: false
    description: override Proxy API base URL
  - name: make-default
    type: boolean
    required: false
    description: set this profile as the default
- name: add-environment
  description: Add a client environment (<Client>-<ENV> + its host URLs) to the registry.
  args:
  - name: name
    type: string
    required: true
    description: environment name, '<Client>-<ENV>' e.g. Delgaz-PROD
  - name: web-base
    type: string
    required: true
    description: Web API host, e.g. https://webapi.delgaz.example
  - name: app-base
    type: string
    required: true
    description: designer / front-end host, e.g. https://delgaz.example
  - name: forms-base
    type: string
    required: true
    description: public forms host, e.g. https://forms.delgaz.example
  - name: auth-base
    type: string
    required: false
    description: legacy auth host (optional; login uses the web host)
  - name: client
    type: string
    required: false
    description: 'client label (default: derived from the name)'
  - name: env
    type: string
    required: false
    description: 'env label e.g. PROD/QA/DEV (default: derived from the name)'
  - name: make-default
    type: boolean
    required: false
    description: switch the default environment to this one
- name: check-auth
  description: Hit a live read endpoint to verify the profile authenticates.
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
- name: create-schedule
  description: Create a schedule (POST /api/Schedules) from a JSON --payload; --cron/--timezone sets a crontab recurrence.
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: payload
    type: string
    required: true
    description: schedule as a JSON object (see PROCESIO-API-NOTES.md for the shape)
  - name: cron
    type: string
    required: false
    description: 5-field crontab expression (min hour day month weekday); sets the recurrence to CRON (type 8) over the --payload. Preview it first with validate-crontab.
  - name: timezone
    type: string
    required: false
    description: IANA timezone id for the cron (e.g. Europe/Bucharest)
  - name: recurrence-info
    type: string
    required: false
    description: human-readable recurrence label (optional)
- name: credential-create
  description: Create a PROCESIO credential from a validated config (build->validate->POST->re-GET). --dry-run to preview the DTO.
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: config
    type: string
    required: false
    description: resource config as a JSON object
  - name: config-file
    type: string
    required: false
    description: path to a JSON config file
  - name: dry-run
    type: boolean
    required: false
    description: build + validate the DTO and return it without creating
  - name: force
    type: boolean
    required: false
    description: bypass the pre-save FE (designer) + BE validation gate
  - name: no-types
    type: boolean
    required: false
    description: skip the advisory data-type-mismatch (warning) layer in the gate
- name: credential-delete
