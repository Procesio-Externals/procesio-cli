- name: sql-convert
  description: Move one SQL node between the Execute Command and Execute Query families (--to) and optionally rebind its Output (--output-variable); validate + flow-lint then PUT (--dry-run to preview). A SELECT-ing procedure on a Command node discards its result set silently - this is the fix.
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: id
    type: string
    required: true
    description: process (project) id
  - name: node
    type: string
    required: true
    description: node actionName or id to convert
  - name: to
    type: string
    required: true
    description: 'target family: query (returns a result set) or command (returns rows affected)'
  - name: output-variable
    type: string
    required: false
    description: flow variable name or id to bind the node's Output to
  - name: dry-run
    type: boolean
    required: false
    description: convert + validate + lint but do not PUT
- name: sql-parameterize
  description: Convert inline N'<%N%>' SQL nodes to safe named-@param binding (--node or --all); validate then PUT (--dry-run to preview).
  args:
  - name: profile
    type: string
    required: false
    description: credential profile name (defaults to the stored default profile)
  - name: workspace-id
    type: string
    required: false
    description: workspace GUID to scope this call (sets/overrides the workspaceid header)
  - name: environment
    type: string
    required: false
    description: PROCESIO environment for this call, e.g. Internal-QA (defaults to the credential's binding, else the default environment / Internal-PROD)
  - name: id
    type: string
    required: true
    description: process (project) id
  - name: node
    type: string
    required: false
    description: node actionName or id to convert
  - name: all
    type: boolean
    required: false
    description: convert every inline SQL node in the process
  - name: dry-run
    type: boolean
    required: false
    description: convert + validate but do not PUT
- name: sql-scan
  description: List a process's SQL Server actions (Execute Query/Command) with inline-vs-parameterized status.
  args:
  - name: profile
