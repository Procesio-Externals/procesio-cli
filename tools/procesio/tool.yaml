  - name: method
    type: string
    required: false
    description: HTTP method (GET/POST/PUT/PATCH/DELETE). Default GET.
  - name: path
    type: string
    required: true
    description: endpoint path, e.g. /api/Projects or /api/Projects/{id}
  - name: query
    type: string
    required: false
