name: web
description: >
  Drive web apps that have NO API via Playwright, reusing SAVED login sessions
  so we authenticate once and reuse. Sessions are Playwright storageState
  (cookies + localStorage) per named site, stored gitignored under
  tools/web/sessions/<name>.json - they hold live auth and are SENSITIVE
  (never committed, never printed). Other tools and the outreach agent call
  this whenever they need to connect to a site or do deeper web research.
  Action-dispatched. No HTTP API; a BrowserDriver abstraction wraps Playwright
  (imported lazily) so the tool loads even before browsers are installed.
  BROKER-OWNED SESSIONS: run/get-text/screenshot against a session owned by a
  serializing broker (whatsapp/ryver/fgo/mirro - tools/_lib/webserialize) are
  executed INSIDE that broker, serialized with the owning tool's commands, so
  ad-hoc web commands can't race the profile. --direct bypasses (backup).
  save-session/delete-session auto-stop the owning broker first.
version: 0.2.0
runtime: python
entrypoint: main.py

# No credentials in Credential Manager: auth lives in saved session files
# (storageState) under tools/web/sessions/, which are gitignored.
secrets: []

routing:
  triggers:
    - "drive/scrape a website that has no API, using a saved login session; deeper web research"
    - "render an HTML page to an image / make a blog cover, social card or banner image from HTML; render HTML to a PDF"
  primary_action: run
  example: "web run --session <name> ...   (read text: web get-text; one-time login: web save-session)"

actions:
  - name: save-session
    description: >
      Interactively capture a login session. Launches a HEADED browser at --url,
      lets the human log in, then captures storageState to
      tools/web/sessions/<name>.json. Run once per site. By default it BLOCKS
      until ENTER is pressed on stdin; an AGENT must instead pass --wait-seconds,
      because agent stdin is EOF and the ENTER wait would return instantly and
      save a half-authenticated profile.
    args:
      - {name: name, type: string, required: true, description: "Session name (letters/digits/._-); how you reference it later"}
      - {name: url, type: string, required: true, description: Login URL to open in the headed browser}
      - {name: channel, type: string, description: "Optional Chromium channel: 'chrome' or 'msedge' (use a real installed browser)"}
      - {name: persistent, type: boolean, description: "Save a PERSISTENT browser profile (user-data-dir) instead of a storageState snapshot; required for IndexedDB-auth sites like WhatsApp Web"}
      - {name: wait-seconds, type: integer, description: "Wait this long for the login instead of blocking on ENTER; required when an agent launches the flow"}
      - {name: wait-until-url-excludes, type: string, description: "With --wait-seconds, finish as soon as the address bar leaves this host (e.g. accounts.google.com)"}
    output_schema: '{ "session": "...", "path": "tools/web/sessions/<name>.json", "url": "...", "waited_for": "enter|timer|url", "login_detected": true }'

  - name: list-sessions
    description: List saved sessions (names + metadata only, never contents).
    output_schema: '{ "sessions": [ {name, bytes, modified, persistent} ], "count": 0, "dir": "..." }'

  - name: delete-session
    description: >
      Delete ALL of a saved session's artifacts - the storageState file, the
      persistent <name>.profile/ directory, and the <name>.cookies.json sidecar.
      Deleting a session destroys a login that only a human at a browser can
      re-establish, so this PREVIEWS by default and removes nothing unless
      --confirm is passed (the unconfirmed call is the dry run).
    args:
      - {name: name, type: string, required: true, description: Session name to delete}
      - {name: confirm, type: boolean, description: "Actually delete; without it the call only previews would_remove"}
    output_schema: '{ "session": "...", "deleted": true, "existed": true, "removed": ["state","profile","cookies"], "would_remove": ["..."], "confirmation_required": true, "failed": {}, "broker_stopped": "..." }'

  - name: run
    description: >
      Load a saved session, optionally navigate to --url, then execute a
      declarative step list (--actions JSON array or --actions-file). Returns
      collected outputs. Step schema (each step has a "do"):
      goto{url,timeout?} | click{selector,timeout?,force?} | fill{selector,text,timeout?} |
      press{key,selector?} | type{text,selector?,timeout?} | wait{ms} |
      wait_for{selector,timeout?} | extract_text{selector?,name,timeout?} |
      extract_attr{selector,attr,name,timeout?} | viewport{width,height} |
      screenshot{path,full_page?}.
      'type' drives real keyboard events (canvas grids like Google Sheets where
      cells aren't DOM); 'wait' is a fixed ms delay (autosave settle).
      Headless by default; --headed to watch. --hold-seconds keeps a headed
      browser open after the steps so a HUMAN can review what was staged and
      click the irreversible control (Submit/Confirm/Send) themselves; an
      expired hold is still a successful run.
    args:
      - {name: session, type: string, required: true, description: Saved session name to load}
      - {name: url, type: string, description: Optional URL to visit before running the steps}
      - {name: actions, type: string, description: "Inline JSON array of steps"}
      - {name: actions-file, type: string, description: "Path to a JSON file containing the steps array"}
      - {name: headed, type: boolean, default: false, description: "Show the browser window (default headless)"}
      - {name: channel, type: string, description: "Chromium channel: 'chrome' or 'msedge'"}
      - {name: hold-seconds, type: integer, description: "After the last step keep the headed browser open up to N seconds for a human to finish the action; requires headed"}
      - {name: hold-until-selector, type: string, description: "End the hold early once this selector appears; requires hold-seconds"}
      - {name: hold-until-url-excludes, type: string, description: "End the hold early once the address bar leaves this host; requires hold-seconds"}
      - {name: direct, type: boolean, default: false, description: "Bypass the owning tool serializing broker and drive the browser in-process (backup; only safe when that broker is stopped)"}
    output_schema: '{ "session": "...", "results": {"name": "value"}, "screenshots": ["..."], "final_url": "...", "hold": {"held_seconds": 0, "completed": false, "reason": "selector|url|timeout"} }'

  - name: get-text
    description: "Convenience: load a session, open --url, return visible text (whole page or --selector). For lead/topic research."
    args:
      - {name: session, type: string, required: true, description: Saved session name to load}
      - {name: url, type: string, required: true, description: URL to navigate to}
      - {name: selector, type: string, description: Optional CSS selector; default reads the whole page body}
      - {name: wait, type: string, description: Optional selector to await before reading (for SPAs)}
      - {name: headed, type: boolean, default: false, description: Show the browser window}
      - {name: channel, type: string, description: "Chromium channel: 'chrome' or 'msedge'"}
      - {name: direct, type: boolean, default: false, description: "Bypass the owning tool serializing broker and drive the browser in-process (backup; only safe when that broker is stopped)"}
    output_schema: '{ "session": "...", "url": "...", "selector": null, "text": "...", "final_url": "..." }'

  - name: screenshot
    description: "Load a session, open --url, save a screenshot to --out."
    args:
      - {name: session, type: string, required: true, description: Saved session name to load}
      - {name: url, type: string, required: true, description: URL to capture}
      - {name: out, type: string, required: true, description: "Output image path (.png)"}
      - {name: viewport-only, type: boolean, default: false, description: "Capture only the viewport (default: full page)"}
      - {name: wait, type: string, description: Optional selector to await first}
      - {name: headed, type: boolean, default: false, description: Show the browser window}
      - {name: channel, type: string, description: "Chromium channel: 'chrome' or 'msedge'"}
      - {name: direct, type: boolean, default: false, description: "Bypass the owning tool serializing broker and drive the browser in-process (backup; only safe when that broker is stopped)"}
    output_schema: '{ "session": "...", "url": "...", "path": "...", "final_url": "..." }'

  - name: archive-document
    description: >
      Capture a published document (web page or PDF) as a reviewable evidence set:
      the ORIGINAL response bytes untouched, a self-contained HTML rendering with
      stylesheets inlined so it opens offline with its layout, and a text
      extraction for searching and quoting. Every readable artefact carries a
      provenance header (title, the date the document states about itself, source
      URL, fetch timestamp, sha256 of the original) so a later capture can be
      compared against it. Unauthenticated fetch only - a login-gated document is
      recorded as unreachable, never substituted with a summary.
    args:
      - {name: url, type: string, description: "URL of the document to capture (exactly one of --url/--file)"}
      - {name: file, type: string, description: "Local file to archive instead of fetching (an already-downloaded original)"}
      - {name: source-url, type: string, description: "With --file: the URL the file came from, recorded in the header"}
      - {name: out-dir, type: string, required: true, description: "Base directory; a subfolder named --name is created inside it"}
      - {name: name, type: string, required: true, description: "Folder and file basename for the document (a slug, not a URL)"}
      - {name: title, type: string, description: "Published title override; default reads <title>/<h1>"}
      - {name: timeout, type: integer, default: 60, description: "Per-request timeout in seconds"}
      - {name: no-self-contained, type: boolean, default: false, description: "Skip the stylesheet-inlined copy (original + extraction only)"}
    output_schema: '{ "name": "...", "dir": "...", "url": "...", "final_url": "...", "status": 200, "kind": "html|pdf", "title": "...", "fetched_at": "...", "bytes": 0, "stylesheets_inlined": 0, "chars_extracted": 0, "document_date_candidates": [{"date": "...", "context": "..."}], "files": {"original": "...", "self_contained": "...", "extraction": "..."}, "sha256": {"original": "...", "self_contained": "...", "extraction": "..."} }'

  - name: page-contacts
    description: >
      The contact details a PUBLIC page publishes, read with one plain HTTP GET (no
      browser, no session, nothing clicked): emails from mailto links and visible
      text (including "name [at] domain [dot] com"), profile links grouped by
      platform (linkedin, x, youtube, instagram, ...), link-in-bio pages, and
      affiliate-shaped links. Meant for link-in-bio pages and personal sites. A
      4xx/5xx page returns reachable=false instead of an error.
    args:
      - {name: url, type: string, required: true, description: "Public page to read (link-in-bio, personal site)"}
      - {name: timeout, type: integer, default: 20, description: "Request timeout in seconds"}
    output_schema: '{ "url": "...", "final_url": "...", "status": 200, "content_type": "...", "reachable": true, "title": "...", "emails": ["..."], "links": {"linkedin": [], "x": [], "website": [], "link_in_bio": [], "...": []}, "affiliate_links": [ {url, host, network, program, param} ] }'

  - name: perf-probe
    description: >
      What a page costs a slower machine, measured in a real Chromium. Slows the
      page's main thread with CDP CPU throttling (4x is roughly a budget laptop next
      to a recent MacBook), lets it boot, then measures a window: frame rate and
      frame-time percentiles (requestAnimationFrame), long tasks, and main-thread
      script / layout / style ms (CDP Performance.getMetrics). The boot is measured
      too: when each --marks selector first appeared and every layout shift (the
      pop-in while a runtime restyles a page that has already drawn). Variants rerun
      the same measurement on a fresh navigation with CSS/JS injected from the first
      frame (CSS needs !important), so one call answers "what does turning X off
      buy". Headless Chromium rasterizes in software, so paint cost (a full-screen
      canvas, a backdrop blur) shows as lower fps and slow frames, not as main-thread
      ms. Read-only: it navigates and watches, it clicks nothing unless --during-js does.
    args:
      - {name: url, type: string, required: true, description: "Page to measure (http/https)"}
      - {name: session, type: string, description: "Saved session to load; default a fresh anonymous context"}
      - {name: cpu-throttle, type: number, default: 4, description: "CPU slowdown factor (1 = this machine, 4 ~ budget laptop, 6 ~ low-end)"}
      - {name: nav-timeout, type: integer, default: 0, description: "Per-load navigation timeout in ms; 0 (default) scales the driver's nav budget by the CPU-throttle rate so a throttled load is not cut off"}
      - {name: viewport, type: string, default: "1366x768", description: "Viewport WIDTHxHEIGHT"}
      - {name: dpr, type: number, default: 1, description: "Device pixel ratio"}
      - {name: settle-ms, type: integer, default: 6000, description: "Wait after load before measuring; the boot is measured over this time"}
      - {name: measure-ms, type: integer, default: 8000, description: "Length of the measured window"}
      - {name: marks, type: string, description: "JSON {name: css selector}: when each first appears during boot"}
      - {name: marks-file, type: string, description: "Path to the --marks JSON"}
      - {name: variants, type: string, description: "JSON array [{name, css?, js?, cpu_throttle?, dpr?, reduced_motion?, settle_ms?, measure_ms?, during_js?, expose_js?}]; each runs on a fresh navigation after the baseline"}
      - {name: variants-file, type: string, description: "Path to the --variants JSON"}
      - {name: no-baseline, type: boolean, default: false, description: "Skip the page-as-served run"}
      - {name: during-js, type: string, description: "JS run at the start of the window (e.g. a scroll loop); default idle"}
      - {name: expose-js, type: string, description: "JS expression read at the end (e.g. the page's own perf counters)"}
      - {name: repeat, type: integer, default: 1, description: "Runs per variant (1-10); the summary is the median"}
      - {name: warmup, type: boolean, default: false, description: "Load the page once, unmeasured, first, so every variant boots from a warm cache (without it only the first run pays for a cold cache)"}
      - {name: headed, type: boolean, default: false, description: "Show the browser window"}
      - {name: channel, type: string, description: "Chromium channel: chrome or msedge"}
      - {name: direct, type: boolean, default: false, description: "Bypass the owning tool serializing broker and drive the browser in-process (only safe when that broker is stopped; perf-probe needs exclusive control anyway)"}
    output_schema: '{ "url": "...", "cpu_throttle": 4, "viewport": "1366x768", "variants": [ {"name": "baseline", "summary": {"fps": 0, "frame_ms_p95": 0, "slow_frames_pct": 0, "busy_pct": 0, "script_ms": 0, "layout_ms": 0, "style_ms": 0, "long_tasks_ms": 0, "boot_cls": 0, "boot_long_tasks_ms": 0}, "calibration_ms": 0, "boot": {"marks": {}, "layout_shift": {"cls": 0, "count": 0, "largest": [{"at_ms": 0, "value": 0, "moved": [{"node": "div.form-builder--form", "y": [0, 0], "height": [0, 0]}]}]}, "long_tasks": {}}, "window": {"fps": 0, "frame_ms": {"p50": 0, "p95": 0, "p99": 0, "max": 0}, "slow_frames_pct": 0, "janky_frames": 0, "long_tasks": {}, "main_thread": {"task_ms": 0, "script_ms": 0, "layout_ms": 0, "style_ms": 0, "other_ms": 0, "busy_pct": 0, "layouts": 0, "style_recalcs": 0, "dom_nodes": 0, "js_heap_mb": 0}}, "exposed": null, "vs_baseline": {}} ], "page_errors": [] }'

  - name: render-pdf
    description: "Render an HTML string/file to a PDF (session-less, headless Chromium page.pdf)."
    args:
      - {name: html, type: string, description: "Inline HTML string to render (exactly one of --html / --html-file)"}
      - {name: html-file, type: string, description: "Path to an HTML file to render"}
      - {name: out, type: string, required: true, description: "Output PDF path (.pdf)"}
      - {name: format, type: string, default: A4, description: "Paper size: A4 (default) / Letter / Legal"}
      - {name: width, type: string, description: "Custom page width as a CSS length, e.g. 1000mm (needs --height; overrides --format) - large-format print such as a roll-up or poster"}
      - {name: height, type: string, description: "Custom page height as a CSS length, e.g. 2000mm (needs --width)"}
      - {name: margin, type: string, description: "One CSS length for all four margins; 0 for full-bleed artwork. Default keeps the document margins (12/14/12/12 mm)"}
    output_schema: '{ "out": "...", "bytes": 12345 }'

  - name: render-image
    description: "Render a local HTML file to an image of exactly --width x --height pixels (session-less, headless Chromium) - artwork built in HTML such as a blog cover or a social card. Opened from its file:// URL so relative assets resolve; web fonts are awaited; only the viewport is captured. .webp is converted with Pillow."
    args:
      - {name: html-file, type: string, required: true, description: "HTML file to render; relative assets (logo, fonts) resolve beside it"}
      - {name: out, type: string, required: true, description: "Output image path: .png, .jpg or .webp"}
      - {name: width, type: integer, required: true, description: "Image width in pixels"}
      - {name: height, type: integer, required: true, description: "Image height in pixels"}
      - {name: quality, type: integer, default: 90, description: "WebP quality 1-100"}
    output_schema: '{ "out": "...", "bytes": 12345, "width": 1600, "height": 900 }'

examples:
  - cmd: python scripts/run-tool.py web save-session --name linkedin --url https://www.linkedin.com/login
    output: '{"session": "linkedin", "path": ".../tools/web/sessions/linkedin.json", "url": "https://www.linkedin.com/login"}'
  - cmd: 'python scripts/run-tool.py web archive-document --url https://example.com/terms --out-dir documentation/legal/existing --name terms'
    output: '{"name": "terms", "dir": "...", "kind": "html", "title": "Terms", "sha256": {"original": "..."}, "files": {"original": "...", "self_contained": "...", "extraction": "..."}}'
  - cmd: python scripts/run-tool.py web list-sessions
    output: '{"sessions": [{"name": "linkedin", "bytes": 4096, "modified": "2026-06-22T09:00:00"}], "count": 1, "dir": "..."}'
  - cmd: 'python scripts/run-tool.py web get-text --session linkedin --url https://www.linkedin.com/in/someone --selector main'
    output: '{"session": "linkedin", "url": "...", "selector": "main", "text": "...", "final_url": "..."}'
  - cmd: 'python scripts/run-tool.py web run --session linkedin --actions "[{\"do\":\"goto\",\"url\":\"https://www.linkedin.com/feed\"},{\"do\":\"extract_text\",\"selector\":\"h1\",\"name\":\"headline\"}]"'
    output: '{"session": "linkedin", "results": {"headline": "..."}, "screenshots": [], "final_url": "..."}'

requires:
  - name: playwright-chromium
    kind: browser
    why: >
      every action that opens a browser. `uv sync` installs the Playwright PACKAGE,
      not the browser binary - and Playwright is imported lazily, so the tool loads
      and the tests pass while the first real action fails with browser_error.
    check: '{python} -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); p.chromium.executable_path; p.stop()"'
    install: uv run playwright install chromium
