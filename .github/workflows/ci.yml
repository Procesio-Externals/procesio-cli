name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The credential store is per-OS, so it is tested per-OS. A change that only
    # works on the maintainer's machine is exactly what this matrix is for.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Without this the matrix is decoration: uv picks its own interpreter,
          # every job runs the same one, and the job names claim a coverage the
          # run does not have.
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: tests
        # Every suite the repo ships, not just the two obvious ones: the
        # dashboard and the MCP bridge carry tests too, and leaving them out
        # meant a green CI that had never exercised either.
        run: uv run pytest tools agents dashboard webplatform -q
      - name: no secrets in tracked files
        run: uv run python scripts/secret_scan.py
      - name: generated files are current
        run: |
          uv run python scripts/build-router.py --check
      - name: skills are valid
        # The manuals are generated, and a generated file nothing parses is how
        # 35 of them shipped with invalid YAML frontmatter. The validator is the
        # thing that would have caught it.
        run: uv run python scripts/validate-skills.py
      - name: the plugin folder passes the directory's rules for a non-Verified organization
        # The Claude plugin directory refuses, from an organization it has not Verified, a
        # local MCP server, any file that is not Markdown / text / JSON / YAML / an image,
        # and SKILL.md frontmatter beyond plain name + description lines. Generated from
        # tools/procesio-oss/community.py in Agents-and-Tools; a PR that breaks a rule
        # fails here instead of in the directory's review.
        run: uv run python scripts/check-plugin.py plugin
      - name: both MCP surfaces start, including the release the plugin README names
        # The plugin declares no server (see above); its README tells people to add
        # `uvx procesio-cli==0.1.6` themselves, so that exact command is
        # what this launches. The full registry surface is the one anybody can configure.
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import json, os, subprocess

          plugin_argv = ["uvx", "procesio-cli==0.1.6"]
          plugin_env = {**os.environ, "UV_PYTHON_PREFERENCE": "system"}
          request = '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}\n'

          for label, argv, env in (
              ("the release the plugin README names", plugin_argv, plugin_env),
              ("full registry surface", ["uvx", "--python-preference", "system",
                                         "--python", ">=3.11",
                                         "--from", ".", "--constraints", "constraints.txt",
                                         "--build-constraints", "build-constraints.txt",
                                         "procesio-mcp"], None),
          ):
              proc = subprocess.run(argv, input=request, capture_output=True,
                                    text=True, timeout=600, env=env)
              if proc.returncode != 0:
                  raise SystemExit(f"{label}: exited {proc.returncode}\n{proc.stderr[-2000:]}")
              tools = json.loads(proc.stdout.splitlines()[0])["result"]["tools"]
              if not tools:
                  raise SystemExit(f"{label}: started but listed no tools")
              print(f"{label}: {len(tools)} tools via {' '.join(argv)}")
          PY
