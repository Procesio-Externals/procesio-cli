# The Claude plugin's runtime: one dependency, the procesio-cli release the plugin runs,
# locked with exact versions and hashes in uv.lock beside this file, which a locked
# install uses to fetch exactly what was locked and reviewed. Keep [tool.uv] to standard
# settings: a plugin directory's frozen install refuses others. Regenerate the lock with
# `procesio-oss lock-plugin` in the upstream repo, never by hand.
[project]
name = "procesio-plugin-runtime"
version = "0.1.3"
description = "Locked runtime for the PROCESIO Claude plugin"
requires-python = ">=3.11"
dependencies = ["procesio-cli==0.1.3"]

[tool.uv]
package = false
